<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Products</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="addProduct.html">Add Product</a></li>
                <li><a href="viewProducts.html">View Products</a></li>
                <li><a href="searchProducts.html">Search Products</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Search Products</h2>
        <form id="searchForm">
            <input type="text" id="query" placeholder="Search by Name or Category" required>
            <input type="button" value="Search" onclick="searchProducts()">
        </form>
        <div id="searchResults"></div>
    </main>
    <footer>
        <p>© 2024 Product Management. All rights reserved.</p>
    </footer>
    <script>
        function searchProducts() {
            const query = document.getElementById('query').value;
            fetch(`SearchServlet?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    const resultsDiv = document.getElementById('searchResults');
                    resultsDiv.innerHTML = '<h3>Search Results:</h3><ul>';
                    data.forEach(product => {
                        resultsDiv.innerHTML += `<li>${product.name} - ${product.category} - ${product.price}</li>`;
                    });
                    resultsDiv.innerHTML += '</ul>';
                });
        }
    </script>
</body>
</html>
